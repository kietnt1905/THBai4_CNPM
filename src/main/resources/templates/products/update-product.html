<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập Nhật Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Cập Nhật Sản Phẩm</h2>
    <form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{image}">
        <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Giá:</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="imageFile" class="form-label">Hình ảnh sản phẩm:</label>
            <div th:if="${product.image != null and !product.image.isEmpty()}" class="mb-2">
                <img th:src="@{'/images/' + ${product.image}}" alt="Ảnh hiện tại" style="width: 100px; height: 100px; object-fit: cover; border-radius: 6px;">
                <p class="text-muted small mt-1 mb-0">Ảnh hiện tại</p>
            </div>
            <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*" onchange="previewImage(event)">
            <small class="text-muted">Chọn ảnh mới nếu muốn thay đổi</small>
            <div class="mt-2">
                <img id="imagePreview" src="#" alt="Xem trước ảnh mới" style="display: none; max-width: 150px; max-height: 150px; border-radius: 6px; object-fit: cover;">
            </div>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Danh mục:</label>
            <select id="category" th:field="*{category}" class="form-select" required>
                <option th:each="cat : ${categories}" 
                        th:value="${cat.id}" 
                        th:text="${cat.name}"
                        th:selected="${product.category != null and cat.id == product.category.id}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả sản phẩm:</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
        <a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
    </form>
    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.src = '#';
                preview.style.display = 'none';
            }
        }
    </script>
</div>
</body>
</html>
