<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Thêm Sản Phẩm Mới</h2>
    <form th:action="@{/products/add}" th:object="${product}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Giá:</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="imageFile" class="form-label">Hình ảnh sản phẩm:</label>
            <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*" onchange="previewImage(event)">
            <div class="mt-2">
                <img id="imagePreview" src="#" alt="Xem trước ảnh" style="display: none; max-width: 150px; max-height: 150px; border-radius: 6px; object-fit: cover;">
            </div>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Danh mục:</label>
            <select id="category" th:field="*{category}" class="form-select" required>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả sản phẩm:</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Thêm Sản Phẩm</button>
        <a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
    </form>
    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.src = '#';
                preview.style.display = 'none';
            }
        }
    </script>
</div>
</body>
</html>
