<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Danh Sách Sản Phẩm</h2>
    <div class="mb-3">
        <a th:href="@{/products/add}" class="btn btn-primary">Thêm Sản Phẩm Mới</a>
    </div>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Hình Ảnh</th>
                <th>Tên Sản Phẩm</th>
                <th>Giá Cả</th>
                <th>Mô Tả</th>
                <th>Danh Mục</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td>
                    <img th:if="${product.image != null and !product.image.isEmpty()}" 
                         th:src="@{'/images/' + ${product.image}}" 
                         alt="Hình ảnh" 
                         style="width: 70px; height: 70px; object-fit: cover; border-radius: 6px;">
                    <span th:if="${product.image == null or product.image.isEmpty()}" class="text-muted small">Không có ảnh</span>
                </td>
                <td th:text="${product.name}"></td>
                <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}"></td>
                <td>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-success btn-sm">Sửa</a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
